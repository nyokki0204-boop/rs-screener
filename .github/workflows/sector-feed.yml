name: Update sector feed
on:
  push:
    branches: [main]
    paths:
      - build_sector_feed.py
      - metrics.py
      - requirements.txt
      - .github/workflows/sector-feed.yml
  schedule:
    - cron: '15 7 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build_sector_feed.py --holdings-only
      - run: python build_sector_feed.py
      - name: Commit only changed feed
        if: always()
        run: |
          if [ ! -d data ]; then exit 0; fi
          git add -A data/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update sector feed'
          git push
